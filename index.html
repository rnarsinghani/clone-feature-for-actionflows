<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Flows — Clone + Copy/Paste Prototype</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Zendesk design tokens ── */
    :root {
      --bg: #F6F5F4;
      --surface: #FFFFFF;
      --surface-elevated: #FFFFFF;
      --text-primary: #293239;
      --text-secondary: #5C6970;
      --accent: #1F73B7;
      --accent-hover: #13456D;
      --success-bg: #037F52;
      --neutral-bg: #E8EAEC;
      --warning: #AC5918;
      --warning-light: #FFF5E6;
      --border: #D8DCDE;
      --border-subtle: #E8EAEC;
      --border-thead: #9C9A99;
      --info-light: rgba(31,115,183,0.08);
      --shadow-sm: 0 1px 2px rgba(3,54,61,0.04);
      --shadow-md: 0 2px 8px rgba(3,54,61,0.08);
      --shadow-lg: 0 4px 16px rgba(3,54,61,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px; line-height: 1.5; color: var(--text-primary);
      background: var(--bg); height: 100vh; overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; }

    /* ── Top bar ── */
    .topbar {
      background: var(--bg); height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; padding-left: 6px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .topbar-admin-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 4px; font-size: 14px; font-weight: 500; color: #2F3941;
    }
    .topbar-admin-btn:hover { background: #f0efed; }
    .search-wrap { position: relative; width: 320px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #68737D; }
    .search-input {
      width: 100%; padding: 8px 16px 8px 36px; background: #F8F9F9;
      border: 1px solid #D8DCDE; border-radius: 999px; font-size: 14px; color: #2F3941;
      outline: none; transition: background 0.15s;
    }
    .search-input:focus { background: white; box-shadow: 0 0 0 3px rgba(79,107,191,0.2); }
    .search-input::placeholder { color: #68737D; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: #68737D;
      display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; }
    .topbar-icon-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 4px; color: #68737D;
    }
    .topbar-icon-btn:hover { background: #f0efed; }

    /* ── Shell layout ── */
    .shell { display: flex; flex-direction: column; height: 100vh; }
    .shell-body { display: flex; flex: 1; min-height: 0; padding: 0 8px 8px; }
    .shell-inner { display: flex; flex: 1; height: 100%; border-radius: 8px; overflow: hidden; }
    .main-surface {
      flex: 1; background: var(--surface); overflow: auto;
      padding: 40px; border-radius: 8px; border: 1px solid var(--border);
    }

    /* ── Icon sidebar ── */
    .icon-rail {
      width: 56px; display: flex; flex-direction: column; align-items: center;
      padding: 16px 12px; gap: 16px; flex-shrink: 0;
    }
    .icon-rail-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: #706F6E; transition: all 0.15s;
    }
    .icon-rail-btn:hover { background: #EAE8E7; color: #2F3941; }
    .icon-rail-btn.active { background: #293239; color: white; }

    /* ── Nav flyout ── */
    .nav-flyout {
      width: 240px; display: flex; flex-direction: column; flex-shrink: 0;
      background: var(--bg);
    }
    .nav-flyout-header { padding: 24px 20px 24px 24px; }
    .nav-flyout-header h2 { font-size: 18px; font-weight: 600; color: #2F3941; }
    .nav-group { padding: 0 12px; margin-bottom: 20px; }
    .nav-group-label { font-size: 12px; font-weight: 600; color: #706F6E; padding: 0 12px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 6px 12px;
      border-radius: 6px; font-size: 14px; font-weight: 500; color: #313131;
      transition: all 0.15s; margin-bottom: 2px;
    }
    .nav-item:hover { background: #EAE8E7; }
    .nav-item.active { background: #293239; color: white; }

    /* ── Page header ── */
    .page-header { margin-bottom: 40px; }
    .breadcrumbs { display: flex; align-items: center; gap: 4px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); }
    .breadcrumbs a { color: var(--accent); }
    .breadcrumbs a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: #C8C6C4; font-size: 10px; }
    .page-title { font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .page-description { font-size: 14px; color: var(--text-secondary); margin-top: 8px; max-width: 700px; line-height: 1.6; }
    .page-description a { color: var(--accent); }
    .page-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }

    /* ── Button ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 40px; padding: 0 16px; border-radius: 4px; font-size: 14px; font-weight: 500;
      transition: all 0.15s; outline: none; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: var(--info-light); }
    .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }

    /* ── Table ── */
    .info-row { font-size: 14px; color: var(--text-secondary); text-align: right; margin-bottom: 16px; }
    .table-wrap { background: var(--surface); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { border-bottom: 1px solid var(--border-thead); }
    th { padding: 16px; text-align: left; font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
    td { padding: 16px; font-size: 14px; color: var(--text-primary); border-bottom: 1px solid var(--border-subtle); font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; cursor: pointer; }
    tbody tr:hover td { background: var(--info-light); }
    .td-link { color: var(--accent); font-weight: 600; }
    .td-link:hover { text-decoration: underline; }
    .td-muted { color: var(--text-secondary); }
    .td-menu { width: 48px; }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border-radius: 2px; font-size: 12px; font-weight: 500;
    }
    .badge-active { background: #037F52; color: white; }
    .badge-inactive { background: #E8EAEC; color: #293239; }

    /* ── Dropdown (list view) ── */
    .dropdown-wrap { position: relative; }
    .dropdown-trigger-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 4px; color: var(--text-secondary); transition: all 0.1s;
    }
    .dropdown-trigger-btn:hover { background: var(--bg); color: var(--text-primary); }
    .dropdown-menu {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 100;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-lg); border-radius: 2px; min-width: 220px; padding: 4px 0;
    }
    .dropdown-item {
      position: relative; display: block; width: 100%; text-align: left;
      padding: 8px 16px; font-size: 14px; color: var(--text-primary); transition: background 0.1s;
    }
    .dropdown-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent); opacity: 0; transition: opacity 0.1s;
    }
    .dropdown-item:hover { background: var(--info-light); }
    .dropdown-item:hover::before { opacity: 1; }
    .dropdown-item.danger { color: #CD3642; }
    .dropdown-item.danger:hover { background: #FFF2F3; }
    .dropdown-item.clone { font-weight: 500; }

    /* ── Clone Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 40; }
    .modal-container {
      position: fixed; inset: 0; z-index: 50; overflow-y: auto;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-panel {
      background: var(--surface-elevated); border-radius: 12px;
      box-shadow: var(--shadow-lg); width: 100%; max-width: 480px; overflow: hidden;
    }
    .modal-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 14px; font-weight: 600; }
    .modal-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--text-secondary); transition: all 0.1s;
    }
    .modal-close:hover { color: var(--text-primary); background: var(--bg); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer {
      padding: 16px 24px; background: #F8F9F9; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .label-text { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .label-text span { color: #CD3642; }
    .read-only-field {
      background: #F8F9F9; border: 1px solid var(--border); border-radius: 4px;
      padding: 8px 12px; font-size: 14px; color: var(--text-secondary);
    }
    .text-input {
      width: 100%; border: 1px solid var(--border); border-radius: 4px;
      padding: 8px 12px; font-size: 14px; color: var(--text-primary);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      height: 40px; background: white;
    }
    .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,115,183,0.12); }
    .checkbox-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .checkbox-row input[type=checkbox] { margin-top: 2px; width: 14px; height: 14px; accent-color: var(--accent); flex-shrink: 0; }
    .checkbox-label { font-size: 14px; font-weight: 500; }
    .checkbox-hint { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .info-box { display: flex; gap: 10px; background: #EDF7FF; border-radius: 6px; padding: 12px 14px; }
    .info-box svg { color: var(--accent); flex-shrink: 0; margin-top: 1px; }
    .info-box p { font-size: 12px; color: #13456D; line-height: 1.5; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #293239; color: white; display: flex; align-items: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow-lg); z-index: 200; white-space: nowrap;
    }
    .toast svg { flex-shrink: 0; }

    /* ── Canvas shell ── */
    .canvas-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: #F8F9F9; flex-shrink: 0;
    }
    .canvas-toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .canvas-toolbar-right { display: flex; align-items: center; gap: 8px; }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-secondary); }
    .back-btn:hover { color: var(--text-primary); }
    .canvas-title { font-size: 14px; font-weight: 600; }
    .canvas-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .canvas-diagram-area {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 32px 40px 60px; background: #FAFAFA; overflow: auto; gap: 0;
    }
    .divider-v { width: 1px; height: 20px; background: var(--border); }

    /* ── Canvas step card ── */
    .canvas-step {
      position: relative;
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 10px 14px; background: white;
      font-size: 13px; min-width: 200px; max-width: 260px;
      box-shadow: var(--shadow-sm); color: var(--text-primary);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: border-color 0.12s;
      flex-shrink: 0;
    }
    .canvas-step:hover { border-color: var(--accent); }
    .canvas-step.warn { border-color: #FFB057; background: #FFF5E6; }
    .canvas-step.just-pasted { border-color: #22C55E; background: #F0FDF4; animation: popIn 0.25s ease; }
    @keyframes popIn { 0% { transform: scale(0.94); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
    .canvas-step-label { flex: 1; line-height: 1.4; }
    .step-dots-btn {
      opacity: 0; flex-shrink: 0; width: 22px; height: 22px;
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); transition: all 0.1s;
    }
    .canvas-step:hover .step-dots-btn { opacity: 1; }
    .step-dots-btn:hover { background: var(--bg); color: var(--text-primary); }

    /* ── Step context menu ── */
    .step-menu {
      position: absolute; right: 0; top: calc(100% + 4px); z-index: 300;
      background: white; border: 1px solid var(--border);
      box-shadow: var(--shadow-lg); border-radius: 6px; min-width: 168px; padding: 4px 0;
    }
    .step-menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 12px; font-size: 13px; color: var(--text-primary);
      text-align: left; transition: background 0.1s; white-space: nowrap;
    }
    .step-menu-item:hover { background: var(--info-light); }
    .step-menu-item.danger { color: #CD3642; }
    .step-menu-item.danger:hover { background: #FFF2F3; }
    .step-menu-item.disabled { opacity: 0.4; pointer-events: none; }
    .step-menu-hr { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── Connectors ── */
    .flow-connector { width: 2px; height: 20px; background: var(--border); margin: 0 auto; flex-shrink: 0; }
    .flow-arrow {
      width: 0; height: 0; margin: 0 auto; flex-shrink: 0;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-top: 7px solid var(--border);
    }

    /* ── Paste zone (step) ── */
    .paste-zone {
      width: 200px; height: 26px; flex-shrink: 0;
      border: 2px dashed var(--accent); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500; color: var(--accent);
      cursor: pointer; transition: background 0.1s; gap: 4px;
    }
    .paste-zone:hover { background: var(--info-light); }

    /* ── Branch block ── */
    .branch-header-node {
      border: 1.5px solid var(--border); border-radius: 8px;
      background: white; padding: 10px 14px;
      font-size: 13px; display: flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-sm); min-width: 220px; flex-shrink: 0;
    }
    .branch-header-node.warn { border-color: #FFB057; background: #FFF5E6; }
    .branch-header-label { flex: 1; }
    .copy-branch-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500; color: var(--accent);
      border: 1px solid rgba(31,115,183,0.4);
      flex-shrink: 0; transition: background 0.1s; white-space: nowrap;
    }
    .copy-branch-btn:hover { background: var(--info-light); }

    /* branch horizontal spread */
    .branch-paths-outer {
      display: flex; flex-direction: column; align-items: center; width: 100%;
    }
    .branch-h-bar {
      height: 2px; background: var(--border); flex-shrink: 0;
      align-self: stretch; margin: 0 40px;
    }
    .branch-paths-row {
      display: flex; align-items: flex-start; justify-content: center; gap: 0;
    }
    .branch-path-col {
      display: flex; flex-direction: column; align-items: center; padding: 0 24px;
    }
    .branch-path-label {
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: var(--info-light); color: var(--accent);
      border: 1px solid rgba(31,115,183,0.2); white-space: nowrap; flex-shrink: 0;
    }
    .branch-path-label.new-branch { background: #F0FDF4; color: #037F52; border-color: #86EFAC; }

    /* Paste branch col */
    .paste-branch-col {
      display: flex; flex-direction: column; align-items: center; padding: 0 24px;
    }
    .paste-branch-box {
      border: 2px dashed var(--accent); border-radius: 8px;
      width: 160px; min-height: 70px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500; color: var(--accent);
      cursor: pointer; padding: 12px; text-align: center; gap: 6px;
      transition: background 0.1s;
    }
    .paste-branch-box:hover { background: var(--info-light); }

    /* ── Clipboard pill ── */
    .clipboard-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px 4px 8px;
      background: var(--info-light); border: 1px solid rgba(31,115,183,0.25);
      border-radius: 999px; font-size: 12px; color: var(--accent); font-weight: 500;
    }
    .clipboard-clear {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      color: var(--text-secondary); flex-shrink: 0;
    }
    .clipboard-clear:hover { background: rgba(0,0,0,0.08); color: var(--text-primary); }

    /* ── Validation panel ── */
    .validation-panel {
      width: 280px; border-left: 1px solid var(--border); display: flex; flex-direction: column;
      background: white; flex-shrink: 0;
    }
    .validation-header { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); background: #FFF5E6; }
    .validation-header h4 { font-size: 13px; font-weight: 600; color: #AC5918; }
    .validation-header p { font-size: 12px; color: #703815; margin-top: 2px; }
    .validation-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .validation-issue { border: 1px solid #FFB057; border-radius: 8px; padding: 12px; background: #FFF9F0; }
    .validation-issue-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .validation-issue-step { font-size: 12px; font-weight: 600; }
    .validation-issue-msg { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
    .validation-dismiss { width: 20px; height: 20px; flex-shrink: 0; color: #9C9A99; display: flex; align-items: center; justify-content: center; }
    .validation-dismiss:hover { color: var(--text-primary); }
    .validation-action-btn {
      margin-top: 10px; width: 100%; padding: 6px 12px; font-size: 12px; font-weight: 500;
      color: #AC5918; border: 1px solid #FFB057; border-radius: 4px; transition: background 0.1s;
    }
    .validation-action-btn:hover { background: #FFE8CC; }

    /* prototype badge */
    .proto-badge {
      font-size: 11px; font-weight: 500; background: #FFF5E6; border: 1px solid #FFB057;
      color: #703815; padding: 2px 8px; border-radius: 999px;
    }
  </style>
</head>
<body>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ─── Flows data ─── */
const FLOWS = [
  { id: 'f1', name: 'Order Return Flow', description: 'Complete order return with refund and notification', trigger: 'Ticket tag: return', successful_runs: 3, failed_runs: 2, action_credits: 48, status: 'active', updated: 'Aug 10, 2026, 2:15 PM' },
  { id: 'f2', name: 'High-Value Refund Approval', description: 'Escalate high-value refunds for human approval', trigger: 'Refund amount > $200', successful_runs: 2, failed_runs: 2, action_credits: 32, status: 'active', updated: 'Aug 9, 2026, 10:30 AM' },
  { id: 'f3', name: 'VIP Customer Routing', description: 'Route VIP tickets to priority queue with Slack alert', trigger: 'Customer tier: VIP', successful_runs: 5, failed_runs: 0, action_credits: 72, status: 'active', updated: 'Aug 8, 2026, 9:20 AM' },
  { id: 'f4', name: 'Escalation Alert', description: 'Multi-channel incident response with escalation matrix', trigger: 'Severity: P0/P1', successful_runs: 0, failed_runs: 0, action_credits: 0, status: 'inactive', updated: 'Aug 5, 2026, 3:10 PM' },
  { id: 'f5', name: 'Subscription Renewal', description: 'Automated renewal with intelligent upsell opportunities', trigger: 'Subscription expiry < 7 days', successful_runs: 3, failed_runs: 1, action_credits: 64, status: 'active', updated: 'Aug 4, 2026, 11:55 AM' },
];

const WARNINGS = [
  { step: 'Update Ticket', issue: 'Custom field "Account Tier" may not exist in this account — select a replacement field', action: 'Select Replacement' },
  { step: 'Post to Slack', issue: 'Slack connection not available — please reconnect to continue', action: 'Reconnect Slack' },
];

/* ─── Canvas nodes ─── */
function getInitialNodes(flowId) {
  if (flowId === 'f1') return [
    { id: 'cn1', type: 'trigger', label: 'Trigger: Ticket tag "return"' },
    {
      id: 'cn2', type: 'branch', label: 'Branch: Refund amount > $200',
      paths: [
        { id: 'cp1', condition: 'Yes — > $200', steps: [
          { id: 'cs1', type: 'action', label: 'Update Ticket: Set priority high', warnKey: 'update ticket' },
          { id: 'cs2', type: 'action', label: 'Post to Slack: #returns-team', warnKey: 'post to slack' },
        ]},
        { id: 'cp2', condition: 'No — ≤ $200', steps: [
          { id: 'cs3', type: 'action', label: 'Send Email: Auto-reply' },
        ]},
      ],
    },
    { id: 'cn3', type: 'action', label: 'Add Tag: processed' },
  ];
  const fallbackSteps = {
    'f2': ['Trigger: Ticket created', 'Branch: Amount > $200', 'Assign to Approvals Team', 'Send Email: Manager notification'],
    'f3': ['Trigger: Ticket created', 'Branch: Tag includes "vip"', 'Update Ticket: Set priority urgent', 'Post to Slack: #vip-alerts'],
    'f4': ['Trigger: Priority changed', 'Branch: Priority is urgent', 'Post to Slack: #escalations', 'Add tag: escalated'],
    'f5': ['Trigger: Subscription expiry', 'Branch: Plan type', 'Send Email: Renewal notice', 'Update CRM: Renewal flag'],
  };
  return (fallbackSteps[flowId] || ['Trigger', 'Action 1', 'Action 2']).map((s, i) => ({
    id: `cn${i}`, type: i === 0 ? 'trigger' : 'action', label: s,
  }));
}

/* ─── List view dropdown ─── */
function DropdownMenu({ flow, onClone, onClose }) {
  const ref = useRef();
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  return (
    <div ref={ref} className="dropdown-menu">
      {[
        { label: 'Edit flow', action: null },
        { label: 'Edit name and description', action: null },
        { label: 'Clone', action: () => onClone(flow), style: 'clone' },
        { label: flow.status === 'active' ? 'Deactivate' : 'Activate', action: null },
        { label: 'View run history', action: null },
        { label: 'Delete', action: null, style: 'danger' },
      ].map(({ label, action, style }) => (
        <button key={label}
          className={`dropdown-item${style ? ' ' + style : ''}`}
          onClick={() => { if (action) action(); else onClose(); }}>
          {label}
        </button>
      ))}
    </div>
  );
}

/* ─── Toast ─── */
function Toast({ msg, icon, onDone }) {

  return (
    <div className="toast">
      {icon || <CheckIcon />}
      {msg}
    </div>
  );
}

/* ─── StepCard ─── */
function StepCard({ node, clipboard, warnSteps, pastedId, onCopy, onPasteBelow, onDelete }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const ref = useRef();
  const hasWarn = warnSteps.has(node.warnKey || node.label.toLowerCase().split(':')[0].trim());
  const isNew = pastedId === node.id;

  useEffect(() => {
    if (!menuOpen) return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [menuOpen]);

  return (
    <div
      ref={ref}
      className={`canvas-step${hasWarn ? ' warn' : ''}${isNew ? ' just-pasted' : ''}`}
    >
      <span className="canvas-step-label">{hasWarn ? '⚠️ ' : ''}{node.label}</span>
      <button className="step-dots-btn" onClick={() => setMenuOpen(v => !v)}><DotsIcon /></button>
      {menuOpen && (
        <div className="step-menu">
          <button className="step-menu-item" onClick={() => { onCopy(node); setMenuOpen(false); }}>
            <CopyIcon /> Copy step
          </button>
          <button
            className={`step-menu-item${clipboard?.type !== 'step' ? ' disabled' : ''}`}
            onClick={() => { if (clipboard?.type === 'step') { onPasteBelow(node.id); setMenuOpen(false); } }}
          >
            <ClipboardIcon /> Paste below
          </button>
          <div className="step-menu-hr" />
          <button className="step-menu-item danger" onClick={() => { onDelete(node.id); setMenuOpen(false); }}>
            <TrashIcon /> Delete step
          </button>
        </div>
      )}
    </div>
  );
}

/* ─── Canvas View ─── */
function CanvasView({ flow, clonedName, onBack }) {
  const [dismissed, setDismissed] = useState([]);
  const [nodes, setNodes] = useState(() => getInitialNodes(flow.id));
  const [clipboard, setClipboard] = useState(null);
  const [pastedId, setPastedId] = useState(null);
  const [toast, setToast] = useState(null);

  const activeWarnings = WARNINGS.filter((_, i) => !dismissed.includes(i));
  const warnSteps = new Set(activeWarnings.map(w => w.step.toLowerCase()));

  function showToast(msg) {
    setToast(msg);
  }

  /* ── Copy handlers ── */
  function handleCopyStep(node) {
    setClipboard({ type: 'step', data: node, label: node.label });
    showToast(`Step copied — click a paste zone to place it`);
  }

  function handleCopyBranch(branchNode) {
    setClipboard({ type: 'branch', data: branchNode, label: branchNode.label });
    showToast(`Branch copied — click the paste zone to add a new branch`);
  }

  /* ── Paste step: top-level (between linear nodes) ── */
  function pasteStepAtIndex(afterIndex) {
    const newStep = { ...clipboard.data, id: uid(), label: clipboard.data.label + ' (Copy)', _fresh: true };
    setNodes(prev => {
      const arr = [...prev];
      arr.splice(afterIndex + 1, 0, newStep);
      return arr;
    });
    setPastedId(newStep.id);
    setClipboard(null);
    showToast(`"${clipboard.data.label}" pasted`);
    setTimeout(() => setPastedId(null), 1500);
  }

  /* ── Paste step: inside a branch path ── */
  function pasteStepInBranch(branchNodeId, pathId, afterStepId) {
    const newStep = { ...clipboard.data, id: uid(), label: clipboard.data.label + ' (Copy)' };
    setNodes(prev => prev.map(n => {
      if (n.id !== branchNodeId) return n;
      return {
        ...n,
        paths: n.paths.map(p => {
          if (p.id !== pathId) return p;
          const idx = afterStepId ? p.steps.findIndex(s => s.id === afterStepId) : p.steps.length - 1;
          const steps = [...p.steps];
          steps.splice(idx + 1, 0, newStep);
          return { ...p, steps };
        }),
      };
    }));
    setPastedId(newStep.id);
    setClipboard(null);
    showToast(`"${clipboard.data.label}" pasted`);
    setTimeout(() => setPastedId(null), 1500);
  }

  /* ── Paste branch ── */
  function pasteBranch(branchNodeId) {
    const src = clipboard.data;
    const newPath = {
      id: uid(),
      condition: (src.paths[0]?.condition || 'New path') + ' (Copy)',
      _isNew: true,
      steps: (src.paths[0]?.steps || []).map(s => ({ ...s, id: uid() })),
    };
    setNodes(prev => prev.map(n => {
      if (n.id !== branchNodeId) return n;
      return { ...n, paths: [...n.paths, newPath] };
    }));
    setClipboard(null);
    showToast(`Branch pasted — update the condition to continue`);
  }

  /* ── Delete step: top-level ── */
  function deleteTopLevelStep(nodeId) {
    setNodes(prev => prev.filter(n => n.id !== nodeId));
  }

  /* ── Delete step: inside a branch path ── */
  function deleteBranchStep(branchNodeId, pathId, stepId) {
    setNodes(prev => prev.map(n => {
      if (n.id !== branchNodeId) return n;
      return {
        ...n,
        paths: n.paths.map(p => {
          if (p.id !== pathId) return p;
          return { ...p, steps: p.steps.filter(s => s.id !== stepId) };
        }),
      };
    }));
  }

  const showPasteZones = clipboard?.type === 'step';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'white', borderRadius: 8, border: '1px solid var(--border)' }}>
      {/* Toolbar */}
      <div className="canvas-toolbar">
        <div className="canvas-toolbar-left">
          <button className="back-btn" onClick={onBack}><BackIcon /> Back to flows</button>
          <div className="divider-v" />
          <span className="canvas-title">{clonedName}</span>
          <span className="badge badge-inactive">Inactive</span>
          {activeWarnings.length > 0 && (
            <span className="badge" style={{ background: '#FFF5E6', color: '#AC5918' }}>
              ⚠️ {activeWarnings.length} issue{activeWarnings.length > 1 ? 's' : ''}
            </span>
          )}
          {clipboard && (
            <div className="clipboard-pill">
              <ClipboardIcon />
              {clipboard.type === 'step' ? 'Step copied' : 'Branch copied'}
              <button className="clipboard-clear" onClick={() => setClipboard(null)} title="Clear clipboard">
                <XIcon />
              </button>
            </div>
          )}
        </div>
        <div className="canvas-toolbar-right">
          <button className="btn btn-outline btn-sm">Save draft</button>
          <button
            className="btn btn-primary btn-sm"
            disabled={activeWarnings.length > 0}
            style={activeWarnings.length > 0 ? { opacity: 0.4, cursor: 'not-allowed' } : {}}>
            {activeWarnings.length > 0 ? 'Resolve issues to activate' : 'Activate flow'}
          </button>
        </div>
      </div>

      {/* Body */}
      <div className="canvas-body">
        <div className="canvas-diagram-area">
          {nodes.map((node, i) => {
            const isBranch = node.type === 'branch';
            return (
              <React.Fragment key={node.id}>
                {/* Paste zone above this node */}
                {showPasteZones && i > 0 && (
                  <>
                    <div className="flow-connector" />
                    <PasteZone onClick={() => pasteStepAtIndex(i - 1)} />
                  </>
                )}

                {i > 0 && !showPasteZones && (
                  <>
                    <div className="flow-connector" />
                    <div className="flow-arrow" />
                  </>
                )}

                {isBranch ? (
                  <BranchBlock
                    node={node}
                    clipboard={clipboard}
                    warnSteps={warnSteps}
                    pastedId={pastedId}
                    onCopyBranch={handleCopyBranch}
                    onCopyStep={handleCopyStep}
                    onPasteStepInBranch={pasteStepInBranch}
                    onPasteBranch={pasteBranch}
                    onDeleteStep={deleteBranchStep}
                  />
                ) : (
                  <StepCard
                    node={node}
                    clipboard={clipboard}
                    warnSteps={warnSteps}
                    pastedId={pastedId}
                    onCopy={handleCopyStep}
                    onPasteBelow={(afterId) => pasteStepAtIndex(i)}
                    onDelete={deleteTopLevelStep}
                  />
                )}
              </React.Fragment>
            );
          })}

          {/* Paste zone after last node */}
          {showPasteZones && (
            <>
              <div className="flow-connector" />
              <PasteZone onClick={() => pasteStepAtIndex(nodes.length - 1)} />
            </>
          )}

          {/* Hint when clipboard is active */}
          {clipboard && (
            <div style={{ marginTop: 24, padding: '8px 16px', background: 'var(--info-light)', borderRadius: 6, fontSize: 12, color: 'var(--accent)', textAlign: 'center', maxWidth: 320 }}>
              {clipboard.type === 'step'
                ? 'Click any dashed zone to paste the step, or use "Paste below" in a step\'s ⋮ menu'
                : 'Click the dashed branch column to add a copy of this branch'}
            </div>
          )}
        </div>

        {/* Validation panel */}
        {activeWarnings.length > 0 && (
          <div className="validation-panel">
            <div className="validation-header">
              <h4>⚠️ Validation Issues ({activeWarnings.length})</h4>
              <p>Resolve all issues before activating</p>
            </div>
            <div className="validation-list">
              {activeWarnings.map((w, i) => {
                const idx = WARNINGS.indexOf(w);
                return (
                  <div key={i} className="validation-issue">
                    <div className="validation-issue-header">
                      <div style={{ flex: 1 }}>
                        <div className="validation-issue-step">Step: "{w.step}"</div>
                        <div className="validation-issue-msg">{w.issue}</div>
                      </div>
                      <button className="validation-dismiss" onClick={() => setDismissed(d => [...d, idx])}><XIcon /></button>
                    </div>
                    <button className="validation-action-btn">{w.action}</button>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

          <button className="topbar-admin-btn">Admin center <ChevronDown /></button>
          <button className="topbar-admin-btn" style={{ fontWeight: 400, color: '#5C6970' }}>acme-corp <ChevronDown /></button>
        </div>
        <div className="topbar-right">
          <div className="search-wrap">
            <SearchIcon />
            <input className="search-input" placeholder="Search admin center" />
          </div>
          <button className="topbar-icon-btn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10.7982 2.26062C10.6925 1.90814 10.3681 1.66675 10.0001 1.66675C9.63208 1.66675 9.30766 1.90814 9.20191 2.26062C8.60241 4.2588 7.82538 5.68376 6.75457 6.75457C5.68376 7.82538 4.2588 8.60241 2.26062 9.20191C1.90814 9.30766 1.66675 9.63208 1.66675 10.0001C1.66675 10.3681 1.90814 10.6925 2.26062 10.7982C4.2588 11.3977 5.68376 12.1747 6.75457 13.2456C7.82538 14.3164 8.60241 15.7413 9.20191 17.7395C9.30766 18.092 9.63208 18.3334 10.0001 18.3334C10.3681 18.3334 10.6925 18.092 10.7982 17.7395C11.3977 15.7413 12.1747 14.3164 13.2456 13.2456C14.3164 12.1747 15.7413 11.3977 17.7395 10.7982C18.092 10.6925 18.3334 10.3681 18.3334 10.0001C18.3334 9.63208 18.092 9.30766 17.7395 9.20191C15.7413 8.60241 14.3164 7.82538 13.2456 6.75457C12.1747 5.68376 11.3977 4.2588 10.7982 2.26062Z" fill="url(#sparkle)"/>
              <defs><linearGradient id="sparkle" x1="-2.5" y1="-2.5" x2="22.5" y2="22.5" gradientUnits="userSpaceOnUse"><stop offset="0.3" stopColor="#9256B1"/><stop offset="1" stopColor="#4F6BBF"/></linearGradient></defs>
            </svg>
          </button>
          <div className="avatar" style={{ marginLeft: 8 }}>R</div>
          <span className="proto-badge" style={{ marginLeft: 12 }}>Prototype</span>
        </div>
      </div>

      {/* Body */}
      <div className="shell-body">
        <div className="shell-inner">
          {/* Icon rail */}
          <div className="icon-rail">
            {[
              { id: 'home', path: 'M11.4163 2.87911C10.5632 2.29258 9.43683 2.29258 8.58367 2.87911L3.58367 6.31661C2.90529 6.78299 2.5 7.55347 2.5 8.37671V15C2.5 16.3807 3.61929 17.5 5 17.5H7.08333C7.54357 17.5 7.91667 17.1269 7.91667 16.6666V13.75C7.91667 12.5994 8.84942 11.6666 10 11.6666C11.1506 11.6666 12.0833 12.5994 12.0833 13.75V16.6666C12.0833 17.1269 12.4564 17.5 12.9167 17.5H15C16.3807 17.5 17.5 16.3807 17.5 15V8.37671C17.5 7.55347 17.0947 6.78299 16.4163 6.31661L11.4163 2.87911Z' },
              { id: 'grid', active: true, path: 'M2.50195 4.99963C2.50195 3.62007 3.62031 2.50171 4.99987 2.50171H6.66654C8.0461 2.50171 9.16445 3.62007 9.16445 4.99963V6.66629C9.16445 8.04586 8.0461 9.16425 6.66654 9.16425H4.99987C3.62031 9.16425 2.50195 8.04586 2.50195 6.66629V4.99963ZM2.50195 13.333C2.50195 11.9534 3.62031 10.8351 4.99987 10.8351H6.66654C8.0461 10.8351 9.16445 11.9534 9.16445 13.333V14.9997C9.16445 16.3792 8.0461 17.4976 6.66654 17.4976H4.99987C3.62031 17.4976 2.50195 16.3792 2.50195 14.9997V13.333ZM10.8353 4.99963C10.8353 3.62007 11.9536 2.50171 13.3332 2.50171H14.9999C16.3795 2.50171 17.4978 3.62007 17.4978 4.99963V6.66629C17.4978 8.04586 16.3795 9.16425 14.9999 9.16425H13.3332C11.9536 9.16425 10.8353 8.04586 10.8353 6.66629V4.99963Z' },
            ].map(({ id, active, path }) => (
              <button key={id} className={`icon-rail-btn${active ? ' active' : ''}`}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d={path}/></svg>
              </button>
            ))}
          </div>

          {/* Nav flyout */}
          <div className="nav-flyout">
            <div className="nav-flyout-header"><h2>Apps and integrations</h2></div>
            <nav>
              <div className="nav-group">
                <div className="nav-group-label">Actions</div>
                {[{ label: 'Action flows', active: true }, { label: 'Custom actions' }, { label: 'Run history' }].map(({ label, active }) => (
                  <div key={label} className={`nav-item${active ? ' active' : ''}`}>{label}</div>
                ))}
              </div>
            </nav>
          </div>

          {/* Main content */}
          <main className="main-surface">
            {view === 'list' ? (
              <>
                <div className="page-header">
                  <div className="breadcrumbs">
                    <a href="#">Apps and integrations</a>
                    <span className="breadcrumb-sep">›</span>
                    <a href="#">Actions</a>
                    <span className="breadcrumb-sep">›</span>
                    <span>Action flows</span>
                  </div>
                  <div className="page-header-row">
                    <div>
                      <h1 className="page-title">Action flows</h1>
                      <p className="page-description">
                        Enhance team productivity with action flows that automate processes and sync data across Zendesk and external systems.{' '}
                        <a href="#">Learn about limits and add-ons</a>
                      </p>
                    </div>
                    <button className="btn btn-primary">Create flow</button>
                  </div>
                </div>
                <div className="info-row">Data is updated hourly and reflects the last 30 days.</div>
                <FlowsTable flows={flows} onClone={setCloneTarget} />
              </>
            ) : (
              canvas && <CanvasView flow={canvas.flow} clonedName={canvas.name} onBack={() => setView('list')} />
            )}
          </main>
        </div>
      </div>

      {cloneTarget && <CloneModal flow={cloneTarget} onConfirm={handleConfirm} onCancel={() => setCloneTarget(null)} />}
      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
